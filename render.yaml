services:
  - type: web
    name: chogchemy
    runtime: docker
    plan: 0.5c-512mb
    numInstances: 1
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 300
    disk:
      name: chogchemy-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/chogchemy.sqlite
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2
      - key: OPENAI_IMAGE_QUALITY
        value: medium
      - key: GENERATION_DAILY_LIMIT
        value: 10
      - key: GENERATION_HOLDER_DAILY_LIMIT
        value: 2
